name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mac
    # GitHub rejects `secrets.X` in a step `if:`, so map the secrets into the
    # job environment and test the environment instead. Without these secrets
    # the job keeps the ad-hoc path and publishes an ad-hoc signed app.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "OPENVOX_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OPENVOX_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET=OpenVox-v${VERSION}-macOS.zip" >> "$GITHUB_ENV"
          echo "RELEASE_DMG=OpenVox-v${VERSION}-macOS.dmg" >> "$GITHUB_ENV"

      - name: Validate build scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/sign-and-notarize.sh

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh import-certificate

      # The step above exports CODESIGN_IDENTITY. The build script signs with
      # the Developer ID when the variable is set, and ad-hoc when it is not.
      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Run self-tests
        run: .build/release/OpenVox --selftest

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict OpenVox.app
          codesign -dvv OpenVox.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' OpenVox.app/Contents/Info.plist)" = "$OPENVOX_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' OpenVox.app/Contents/Info.plist)" = "io.kanalabs.openvox"

      - name: Package release
        run: ditto -c -k --sequesterRsrc --keepParent OpenVox.app "$RELEASE_ASSET"

      # Notarization staples the ticket to the app, so the asset is packed
      # again here. The checksum runs after this step on both paths.
      - name: Notarize and staple
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh notarize "$RELEASE_ASSET"

      # The Applications alias makes the drag target obvious. macOS
      # translocates an app that runs from Downloads to a random read-only
      # path, and the Accessibility grant then binds to a path that the next
      # launch does not keep.
      - name: Build disk image
        run: |
          STAGING="$(mktemp -d)"
          cp -R OpenVox.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname OpenVox -srcfolder "$STAGING" -format UDZO -ov "$RELEASE_DMG"
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            codesign -s "$CODESIGN_IDENTITY" "$RELEASE_DMG"
          fi

      - name: Notarize disk image
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh notarize "$RELEASE_DMG"

      - name: Checksum release assets
        run: |
          shasum -a 256 "$RELEASE_ASSET" > "$RELEASE_ASSET.sha256"
          shasum -a 256 "$RELEASE_DMG" > "$RELEASE_DMG.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RELEASE_DMG" "$RELEASE_DMG.sha256" \
              "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_DMG" \
              "$RELEASE_DMG.sha256" \
              "$RELEASE_ASSET" \
              "$RELEASE_ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "OpenVox $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Delete temporary keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh cleanup
