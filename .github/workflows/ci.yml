name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    # GitHub rejects `secrets.X` in a step `if:`, so map the secrets into the
    # job environment and test the environment instead. A pull request from a
    # fork gets no secrets, so it builds the ad-hoc bundle.
    #
    # ponytail: every pull request that has the secrets also notarizes, which
    # adds a few minutes. Ceiling: slower pull-request runs. Upgrade path:
    # notarize in release.yml only, or gate this on a label.
    env:
      PR_ASSET: OpenVox-PR-${{ github.event.pull_request.number }}.zip
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate build scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/sign-and-notarize.sh

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh import-certificate

      # The step above exports CODESIGN_IDENTITY. The build script signs with
      # the Developer ID when the variable is set, and ad-hoc when it is not.
      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Run self-tests
        run: .build/release/OpenVox --selftest

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict OpenVox.app
          codesign -dvv OpenVox.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' OpenVox.app/Contents/Info.plist)" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' OpenVox.app/Contents/Info.plist)" = "io.kanalabs.openvox"

      - name: Package pull-request build
        run: ditto -c -k --sequesterRsrc --keepParent OpenVox.app "$PR_ASSET"

      # Notarization staples the ticket to the app, so the artifact is packed
      # again here.
      - name: Notarize and staple
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh notarize "$PR_ASSET"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVox-PR-${{ github.event.pull_request.number }}
          path: mac/${{ env.PR_ASSET }}
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: ./scripts/sign-and-notarize.sh cleanup
